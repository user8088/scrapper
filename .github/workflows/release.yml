name: Build and Release

# Publish a release whenever a vX.Y.Z tag is pushed (see scraper/release.ps1).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "pulse rx/scraper"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt

      - name: Verify version.py matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Select-String -Path version.py -Pattern '"(.+?)"').Matches.Groups[1].Value
          if ($tag -ne $ver) {
            Write-Error "Tag $tag does not match version.py ($ver). Bump version.py and re-tag."
          }
          Write-Host "Version OK: $ver"

      - name: Build executable
        run: |
          python -m PyInstaller --onefile --windowed --clean `
            --name PulseRxScraper `
            --hidden-import lxml `
            --hidden-import lxml._elementpath `
            app.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "pulse rx/scraper/dist/PulseRxScraper.exe"
          generate_release_notes: true
          fail_on_unmatched_files: true
